version: '3.8'
services:
  db:
    image: mysql:8.0
    environment:
      # Credenciales desde .env (con defaults solo para dev local)
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sas_agricolas}
      MYSQL_USER: ${MYSQL_USER:-sas_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sas_pass}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: node server/index.js
    env_file: .env
    environment:
      # Dentro de la red de compose, el bot se alcanza por su nombre de servicio.
      WHATSAPP_BOT_URL: http://bot:3004
    ports:
      - "3002:3002"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

  # Bot de WhatsApp aislado: se comunica con el API solo dentro de la red
  # interna (no se expone a la máquina host: solo `expose`, sin `ports`).
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    command: node server/whatsapp-bot.js
    env_file: .env
    environment:
      WHATSAPP_BOT_HOST: 0.0.0.0
      WHATSAPP_BOT_URL: http://127.0.0.1:3004
    expose:
      - "3004"
    depends_on:
      - db
    volumes:
      - .:/app
      - auth_info_baileys:/app/auth_info_baileys
    restart: unless-stopped

  client:
    image: node:18-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    environment:
      - VITE_API_URL=http://localhost:3002
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data:
  auth_info_baileys:
